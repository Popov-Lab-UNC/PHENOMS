[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "phenoms"
version = "0.2.5"
description = "Backbone H-bond network analysis for MD simulations (HDX-MS style)"
readme = "PYPI_README.md"
license = { text = "MIT" }
requires-python = ">=3.9,<3.14"
authors = [{ name = "Brandon Novy", email = "bcnovy96@gmail.com" }]
keywords = ["molecular-dynamics", "hydrogen-bonds", "HDX-MS", "backbone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
dependencies = [
    "mdtraj>=1.9",
    "polars>=1.0",
    "pandas>=1.0",
    "numpy>=1.20",
    "matplotlib>=3.5",
    "seaborn>=0.11",
    "tqdm>=4.60",
    "joblib>=1.0",
    "scikit-learn>=1.0",
    "networkx>=3.0",
    "click>=8.0",
    "biopython>=1.79",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
gromacs = ["MDAnalysis>=2.4"]
benchmark = ["MDAnalysis>=2.4"]
docs = [
    "sphinx>=7.0,<9",
    "shibuya>=2024.7.0",
    "myst-parser>=3.0",
]

[project.scripts]
phenoms = "phenoms.cli:main"

[tool.maturin]
module-name = "phenoms.phenoms_hbond_rs"
python-source = "."
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
exclude = [".DS_Store", "**/.DS_Store", "**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
